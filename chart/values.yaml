# gke, eks or aks.
cloud: gke

# How the provider reaches Amp. Nothing connects in: `amp orb provider`, in the provider Pod,
# claims sandbox jobs from Amp over outbound HTTPS and runs them against the provider next to
# it. The provider token (Amp's workspace settings, Orb providers) is not a value: before
# installing, create the Secret `amp-orb-spawner` in the release namespace with the key
# `AMP_ORB_PROVIDER_TOKEN`. Helm never sees it. Orbs also need outbound HTTPS/WSS to Amp plus
# Git, package, and image access; see orb-provider/substrate/doc/self-hosted.md.
amp:
  url: https://ampcode.com

# The `amp orb provider` container of the provider Pod. Stateless; every Pod claims from the same
# queue.
spawner:
  npm:
    # Optional npm registry for the CLI installed at startup. Empty uses npm's default.
    registry: ''
    # Existing Secret in this release's namespace with a .npmrc key. Mounted read-only as
    # npm's user config; keep registry credentials here, not in Helm values.
    existingConfigSecret: ''
  dispatch:
    # Optional existing ConfigMap in this release's namespace with a `dispatch` key holding an
    # executable script. The controller runs it for every job instead of the image's
    # /usr/local/bin/amp-orb-dispatch, which stays in the image so a wrapper can `exec` it after
    # its own logging or auditing. Its stdout and stderr go to the spawner container's log.
    existingConfigMap: ''
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      memory: 1Gi

provider:
  # Pods, each a spawner and a provider container. Any number; they share Amp's job queue.
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

# Where paused sandboxes are stored. Substrate uses gs://<bucket>/<prefix> for every backend.
# GKE: a GCS bucket. EKS: an S3 bucket in the cluster's region. AKS: a container in
# snapshots.aks.storageAccount (gs://<container>/<prefix>).
snapshots:
  location: ''
  # EKS only. Required.
  eks:
    # Region of the cluster and the bucket.
    region: ''
    # IAM role (IRSA) Substrate assumes to read, write and delete in the bucket. Its trust policy
    # must allow both ate-system/atelet and ate-system/ate-api-server.
    ateletRoleArn: ''
  # AKS only. Required.
  aks:
    # Storage account that holds the container.
    storageAccount: ''
    # Client ID of the user-assigned managed identity (workload identity) Substrate uses to read,
    # write and delete in the container. It needs federated credentials for both
    # ate-system/atelet and ate-system/ate-api-server.
    clientId: ''

# Substrate workers. One worker hosts one running sandbox of `sandbox` size. The worker pod requests
# 1 CPU and `memoryGi` + 1Gi, with `cpu` as its CPU limit, so memory decides how many workers fit a
# node. Every Amp size gets `sandbox`; the default is Amp's largest (a1.xxlarge). The provider
# keeps the WorkerPool at max(min, busy + waiting + warm) workers, `warm` being the idle workers
# kept ready for the next sandbox. The node pool is the ceiling.
workers:
  sandbox:
    cpu: 16
    memoryGi: 32
  min: 1
  warm: 2

# An upgrade that changes the orb runtime first pauses every running orb (up to ten minutes),
# which resumes on its thread's next use; otherwise the upgrade loses them. Set false to skip.
upgrade:
  pauseSandboxes: true

# Substrate's atelet pulls the sandbox image, the orbd image volume and the pause image itself, not
# through kubelet, so the cluster's imagePullSecrets do not apply to them.
atelet:
  registry:
    # Name of a kubernetes.io/dockerconfigjson Secret in the ate-system namespace that atelet uses
    # as its Docker config for those pulls, for images in a private registry (Artifactory, a
    # mirror). Optional: without the Secret every registry is pulled anonymously. Not needed for
    # images in GAR on GKE or ECR on EKS, which use the cluster identity.
    dockerConfigSecret: atelet-registry-credentials

