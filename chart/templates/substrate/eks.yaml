apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: ate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  serviceName: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
      - args:
        - -c
        - config_file=/etc/postgresql/postgresql.conf
        env:
        - name: POSTGRES_DB
          value: atepg
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_HOST_AUTH_METHOD
          value: trust
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        lifecycle:
          postStart:
            exec:
              command:
              - /bin/sh
              - -ec
              - |-
                until psql -U "${POSTGRES_USER}" -d postgres -Atc 'SELECT 1' >/dev/null 2>&1; do
                  sleep 1
                done
                if ! psql -U "${POSTGRES_USER}" -d postgres -Atc \
                  "SELECT 1 FROM pg_database WHERE datname = 'atepg'" | grep -qx 1; then
                  createdb -U "${POSTGRES_USER}" atepg
                fi
                psql -U "${POSTGRES_USER}" -d atepg --no-psqlrc --set=ON_ERROR_STOP=1 --single-transaction \
                  --set=substrate_schema=substrate \
                  --set=substrate_owner_role=substrate_owner \
                  --set=substrate_owner_user=substrate_owner_user \
                  --set=substrate_owner_password= \
                  --set=substrate_readwrite_role=substrate_readwrite \
                  --set=substrate_readwrite_user=substrate_readwrite_user \
                  --set=substrate_readwrite_password= \
                  -f /etc/postgres-setup/setup.sql >/dev/null
        livenessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - pg_isready -U "${POSTGRES_USER}" -d postgres
          initialDelaySeconds: 10
          periodSeconds: 10
        name: postgres
        ports:
        - containerPort: 5432
          name: postgres
        readinessProbe:
          exec:
            command:
            - /bin/sh
            - -ec
            - nc -z 127.0.0.1 5432
          initialDelaySeconds: 2
          periodSeconds: 2
        resources:
          limits:
            cpu: "16"
            memory: 2Gi
          requests:
            cpu: "2"
            memory: 1Gi
        volumeMounts:
        - mountPath: /etc/postgresql
          name: config
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns
          readOnly: true
        - mountPath: /run/postgres.podcert.ate.dev
          name: postgres-ca
          readOnly: true
        - mountPath: /var/run/postgresql
          name: socket
        - mountPath: /var/lib/postgresql/data
          name: data
        - mountPath: /etc/postgres-setup
          name: postgres-setup
          readOnly: true
      initContainers:
      - args:
        - --file-mode=0640
        - --cert=servicedns.podcert.ate.dev/identity=/out/servicedns
        - --trust=postgres.podcert.ate.dev/identity=/out/postgres-ca
        image: {{ include "orb-provider.image" (list $ .Values.images.substrate.podcertAgent) }}
        name: podcert-agent
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          exec:
            command:
            - /ko-app/podcert-agent
            - --check
            - --cert=servicedns.podcert.ate.dev/identity=/out/servicedns
            - --trust=postgres.podcert.ate.dev/identity=/out/postgres-ca
          failureThreshold: 300
          periodSeconds: 1
        volumeMounts:
        - mountPath: /var/run/secrets/podcert.ate.dev
          name: podcert-token
          readOnly: true
        - mountPath: /run/podcert-trust
          name: podcert-trust
          readOnly: true
        - mountPath: /out/servicedns
          name: servicedns
        - mountPath: /out/postgres-ca
          name: postgres-ca
      - command:
        - /bin/sh
        - /etc/postgresql/reload-tls.sh
        env:
        - name: POSTGRES_USER
          value: postgres
        image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
        name: tls-reloader
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
        restartPolicy: Always
        securityContext:
          runAsUser: 70
        volumeMounts:
        - mountPath: /etc/postgresql
          name: config
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns
          readOnly: true
        - mountPath: /run/postgres.podcert.ate.dev
          name: postgres-ca
          readOnly: true
        - mountPath: /var/run/postgresql
          name: socket
      securityContext:
        fsGroup: 70
        fsGroupChangePolicy: OnRootMismatch
      volumes:
      - name: podcert-token
        projected:
          sources:
          - serviceAccountToken:
              audience: podcert.ate.dev
              expirationSeconds: 3600
              path: token
      - configMap:
          name: podcert-trust-bundles
        name: podcert-trust
      - emptyDir:
          medium: Memory
        name: servicedns
      - emptyDir:
          medium: Memory
        name: postgres-ca
      - configMap:
          name: postgres-config
        name: config
      - emptyDir: {}
        name: socket
      - configMap:
          name: postgres-setup-h7k5m47g66
        name: postgres-setup
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 500Gi
