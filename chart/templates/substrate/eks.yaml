apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: sandboxconfig-assets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
    - apiGroups:
      - ate.dev
      apiVersions:
      - v1alpha1
      operations:
      - CREATE
      - UPDATE
      resources:
      - sandboxconfigs
  validations:
  - expression: |-
      object.spec.sandboxClass != 'gvisor' || object.spec.versions.all(v,

        has(v.assets) && size(v.assets) > 0 &&
        v.assets.all(arch, 'gvisor' in v.assets[arch]))
    message: a gvisor SandboxConfig must define a 'gvisor' (release tarball) asset
      for every architecture of every version under spec.versions[].assets
  - expression: |-
      object.spec.sandboxClass != 'microvm' || object.spec.versions.all(v,

        has(v.assets) && size(v.assets) > 0 &&
        v.assets.all(arch,
          ['cloud-hypervisor', 'virtiofsd', 'kata-kernel', 'kata-image']
            .all(name, name in v.assets[arch])))
    message: a microvm SandboxConfig must define cloud-hypervisor, virtiofsd, kata-kernel,
      and kata-image assets for every architecture of every version under spec.versions[].assets
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: sandboxconfig-assets
spec:
  policyName: sandboxconfig-assets
  validationActions:
  - Deny
