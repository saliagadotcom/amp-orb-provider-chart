apiVersion: scheduling.k8s.io/v1
description: Node-local ate components that every actor activation depends on.
globalDefault: false
kind: PriorityClass
metadata:
  name: ate-node-critical
value: 1000000000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ate-api-server
  namespace: ate-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ate-api-server
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        prometheus.io/port: "9090"
        prometheus.io/scrape: "true"
      labels:
        app: ate-api-server
    spec:
      containers:
      - args:
        - --grpc-server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem
        - --config-file=/run/apiconfig.ate.dev/apiconfig.textproto
        - --authentication-config=/etc/ateapi/authentication/authentication.yaml
        - --postgres-read-write-connection-string=@env
        - --postgres-owner-connection-string=@env
        - --postgres-read-write-role=@env
        - --postgres-owner-role=@env
        - --postgres-schema=@env
        - --actor-id-jwt-pool=/run/actor-id-jwt-pool/pool.json
        - --actor-jwt-issuer=@env
        - --actor-id-ca-pool=/run/actor-id-ca-pool/pool.json
        - --atelet-client-cred-bundle=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - --pod-identity-ca-certs=/run/podidentity.podcert.ate.dev/trust-bundle.pem
        - --default-egress-gateway-address=atenet-egress.ate-system.svc:443
        - --drain-delay=13s
        - --drain-timeout=15s
        - --objectstore-plugin-socket=/run/objectstore-plugin/control.sock
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        envFrom:
        - configMapRef:
            name: ate-otel-config
        - configMapRef:
            name: ate-api-server-envvars
            optional: true
        - secretRef:
            name: ate-api-server-secret-envvars
            optional: true
        image: {{ include "orb-provider.image" (list $ .Values.images.substrate.ateapi) }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
        name: ate-api-server
        ports:
        - containerPort: 443
        - containerPort: 9090
          name: prometheus
        - containerPort: 9091
          name: health
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 2
        startupProbe:
          failureThreshold: 24
          httpGet:
            path: /healthz
            port: health
          periodSeconds: 5
        volumeMounts:
        - mountPath: /run/objectstore-plugin
          name: objectstore-plugin
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns
        - mountPath: /run/podidentity.podcert.ate.dev
          name: podidentity
        - mountPath: /run/postgres.podcert.ate.dev
          name: postgres
          readOnly: true
        - mountPath: /run/actor-id-jwt-pool
          name: actor-id-jwt-pool
        - mountPath: /run/actor-id-ca-pool
          name: actor-id-ca-pool
          readOnly: true
        - mountPath: /run/apiconfig.ate.dev
          name: api-config
          readOnly: true
        - mountPath: /etc/ateapi/authentication
          name: authentication-config
          readOnly: true
        - mountPath: /run/postgres-server-ca
          name: postgres-server-ca
          readOnly: true
      initContainers:
      - args:
        - --cert=servicedns.podcert.ate.dev/identity=/out/servicedns
        - --cert=podidentity.podcert.ate.dev/identity=/out/podidentity
        - --cert=postgres.podcert.ate.dev/identity=/out/postgres,file=substrate_owner_user.pem,trust=false,annotation=postgres.podcert.ate.dev/username=substrate_owner_user
        - --cert=postgres.podcert.ate.dev/identity=/out/postgres,file=substrate_readwrite_user.pem,trust=false,annotation=postgres.podcert.ate.dev/username=substrate_readwrite_user
        image: {{ include "orb-provider.image" (list $ .Values.images.substrate.podcertAgent) }}
        name: podcert-agent
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          exec:
            command:
            - /ko-app/podcert-agent
            - --check
            - --cert=servicedns.podcert.ate.dev/identity=/out/servicedns
            - --cert=podidentity.podcert.ate.dev/identity=/out/podidentity
            - --cert=postgres.podcert.ate.dev/identity=/out/postgres,file=substrate_owner_user.pem,trust=false,annotation=postgres.podcert.ate.dev/username=substrate_owner_user
            - --cert=postgres.podcert.ate.dev/identity=/out/postgres,file=substrate_readwrite_user.pem,trust=false,annotation=postgres.podcert.ate.dev/username=substrate_readwrite_user
          failureThreshold: 300
          periodSeconds: 1
        volumeMounts:
        - mountPath: /var/run/secrets/podcert.ate.dev
          name: podcert-token
          readOnly: true
        - mountPath: /run/podcert-trust
          name: podcert-trust
          readOnly: true
        - mountPath: /out/servicedns
          name: servicedns
        - mountPath: /out/podidentity
          name: podidentity
        - mountPath: /out/postgres
          name: postgres
      - args:
        - control
        - --socket=/run/objectstore-plugin/control.sock
        env:
        - name: ATE_STORAGE_BACKEND
          value: s3
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              key: region
              name: ate-aws-config
        envFrom:
        - configMapRef:
            name: ate-otel-config
        image: {{ include "orb-provider.image" (list $ .Values.images.substrate.objectstorePlugin) }}
        name: objectstore-plugin
        restartPolicy: Always
        securityContext:
          capabilities:
            drop:
            - ALL
        startupProbe:
          exec:
            command:
            - /ko-app/objectstore-plugin
            - healthcheck
            - --socket=/run/objectstore-plugin/control.sock
          failureThreshold: 30
          periodSeconds: 2
        volumeMounts:
        - mountPath: /run/objectstore-plugin
          name: objectstore-plugin
      serviceAccountName: ate-api-server
      terminationGracePeriodSeconds: 40
      volumes:
      - name: podcert-token
        projected:
          sources:
          - serviceAccountToken:
              audience: podcert.ate.dev
              expirationSeconds: 3600
              path: token
      - configMap:
          name: podcert-trust-bundles
        name: podcert-trust
      - emptyDir:
          medium: Memory
        name: servicedns
      - emptyDir:
          medium: Memory
        name: podidentity
      - emptyDir:
          medium: Memory
        name: postgres
      - emptyDir: {}
        name: objectstore-plugin
      - name: actor-id-jwt-pool
        projected:
          sources:
          - secret:
              items:
              - key: pool
                path: pool.json
              name: actor-id-jwt-pool
      - name: actor-id-ca-pool
        projected:
          sources:
          - secret:
              items:
              - key: pool
                path: pool.json
              name: actor-id-ca-pool
      - configMap:
          name: ate-api-config
        name: api-config
      - configMap:
          name: ate-api-authentication
        name: authentication-config
      - name: postgres-server-ca
        secret:
          optional: true
          secretName: postgres-server-ca
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ate-controller
  namespace: ate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ate-controller
  template:
    metadata:
      labels:
        app: ate-controller
    spec:
      containers:
      - args:
        - --ateapi-ca-file=/run/servicedns-ca/trust-bundle.pem
        - --ateapi-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - --dns-egress-policy=enforce-in-atunnel
        - --pki-delivery=agent
        - --egress-mitm-trust-sink=configmap
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),service.instance.id=$(POD_UID)
        - name: PODCERT_AGENT_IMAGE
          value: {{ include "orb-provider.image" (list $ .Values.images.substrate.podcertAgent) }}
        envFrom:
        - configMapRef:
            name: ate-otel-config
        image: {{ include "orb-provider.image" (list $ .Values.images.substrate.atecontroller) }}
        name: ate-controller
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        - containerPort: 8081
          name: healthz
          protocol: TCP
        volumeMounts:
        - mountPath: /run/podidentity.podcert.ate.dev
          name: podidentity
        - mountPath: /run/servicedns-ca
          name: servicedns-ca
      initContainers:
      - args:
        - --cert=podidentity.podcert.ate.dev/identity=/out/podidentity
        - --trust=servicedns.podcert.ate.dev/identity=/out/servicedns-ca
        image: {{ include "orb-provider.image" (list $ .Values.images.substrate.podcertAgent) }}
        name: podcert-agent
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          exec:
            command:
            - /ko-app/podcert-agent
            - --check
            - --cert=podidentity.podcert.ate.dev/identity=/out/podidentity
            - --trust=servicedns.podcert.ate.dev/identity=/out/servicedns-ca
          failureThreshold: 300
          periodSeconds: 1
        volumeMounts:
        - mountPath: /var/run/secrets/podcert.ate.dev
          name: podcert-token
          readOnly: true
        - mountPath: /run/podcert-trust
          name: podcert-trust
          readOnly: true
        - mountPath: /out/podidentity
          name: podidentity
        - mountPath: /out/servicedns-ca
          name: servicedns-ca
      serviceAccountName: ate-controller
      volumes:
      - name: podcert-token
        projected:
          sources:
          - serviceAccountToken:
              audience: podcert.ate.dev
              expirationSeconds: 3600
              path: token
      - configMap:
          name: podcert-trust-bundles
        name: podcert-trust
      - emptyDir:
          medium: Memory
        name: podidentity
      - emptyDir:
          medium: Memory
        name: servicedns-ca
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ate-idp-server
  namespace: ate-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ate-idp-server
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: ate-idp-server
    spec:
      containers:
      - args:
        - --actor-id-jwt-pool=/run/actor-id-jwt-pool/pool.json
        - --server-cred-bundle=/run/servicedns.podcert.ate.dev/credential-bundle.pem
        - --issuer=https://idp.ate-system.svc
        image: {{ include "orb-provider.image" (list $ .Values.images.substrate.ateIdpServer) }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          periodSeconds: 10
        name: ate-idp-server
        ports:
        - containerPort: 8443
          name: https
        readinessProbe:
          httpGet:
            path: /healthz
            port: https
            scheme: HTTPS
          periodSeconds: 5
        securityContext:
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns
        - mountPath: /run/actor-id-jwt-pool
          name: actor-id-jwt-pool
      initContainers:
      - args:
        - --cert=servicedns.podcert.ate.dev/identity=/out/servicedns,trust=false
        image: {{ include "orb-provider.image" (list $ .Values.images.substrate.podcertAgent) }}
        name: podcert-agent
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          exec:
            command:
            - /ko-app/podcert-agent
            - --check
            - --cert=servicedns.podcert.ate.dev/identity=/out/servicedns,trust=false
          failureThreshold: 300
          periodSeconds: 1
        volumeMounts:
        - mountPath: /var/run/secrets/podcert.ate.dev
          name: podcert-token
          readOnly: true
        - mountPath: /run/podcert-trust
          name: podcert-trust
          readOnly: true
        - mountPath: /out/servicedns
          name: servicedns
      serviceAccountName: ate-idp-server
      volumes:
      - name: podcert-token
        projected:
          sources:
          - serviceAccountToken:
              audience: podcert.ate.dev
              expirationSeconds: 3600
              path: token
      - configMap:
          name: podcert-trust-bundles
        name: podcert-trust
      - emptyDir:
          medium: Memory
        name: servicedns
      - name: actor-id-jwt-pool
        projected:
          sources:
          - secret:
              items:
              - key: pool
                path: pool.json
              name: actor-id-jwt-pool
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: atenet-egress
  name: atenet-egress
  namespace: ate-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atenet-egress
  template:
    metadata:
      labels:
        app: atenet-egress
    spec:
      containers:
      - args:
        - -c
        - /etc/envoy/envoy.yaml
        - --service-node
        - atenet-egress
        - --service-cluster
        - atenet-egress
        image: {{ include "orb-provider.image" (list $ .Values.images.substrate.envoyDataplane) }}
        lifecycle:
          preStop:
            exec:
              command:
              - sh
              - -c
              - while [ ! -f /var/run/atenet/drain-complete ]; do sleep 0.5; done
        name: envoy
        ports:
        - containerPort: 443
          name: https
        - containerPort: 15090
          name: envoy-metrics
        readinessProbe:
          httpGet:
            path: /ready
            port: envoy-metrics
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 65532
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /ready
            port: envoy-metrics
          periodSeconds: 1
        volumeMounts:
        - mountPath: /etc/envoy
          name: config
          readOnly: true
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns
          readOnly: true
        - mountPath: /run/podidentity.podcert.ate.dev
          name: podidentity
          readOnly: true
        - mountPath: /run/actor-id-ca-certs
          name: actor-id-ca-certs
          readOnly: true
        - mountPath: /var/run/atenet
          name: drain-signal
          readOnly: true
        - mountPath: /var/run/sdsmint
          name: sdsmint-sock
      - args:
        - router
        - --mode=egress
        - --namespace=ate-system
        - --port-extproc=50051
        - --extproc-address=127.0.0.1
        - --ateapi-address=dns:///api.ate-system.svc:443
        - --ateapi-ca-file=/run/servicedns.podcert.ate.dev/trust-bundle.pem
        - --ateapi-client-cert=/run/podidentity.podcert.ate.dev/credential-bundle.pem
        - --actor-identity-ca-file=/run/actor-id-ca-certs/ca.crt
        - --otlp-collector-address=
        - --envoy-admin-address=127.0.0.1:15000
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
