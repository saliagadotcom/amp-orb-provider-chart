            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: OTEL_RESOURCE_ATTRIBUTES
          value: k8s.namespace.name=$(POD_NAMESPACE),k8s.pod.name=$(POD_NAME),k8s.pod.uid=$(POD_UID),k8s.node.name=$(NODE_NAME),service.instance.id=$(POD_UID)
        - name: DOCKER_CONFIG
          value: /etc/atelet/docker
        envFrom:
        - configMapRef:
            name: ate-otel-config
        image: {{ include "orb-provider.image" (list $ .Values.images.substrate.atelet) }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 10
          periodSeconds: 10
        name: atelet
        ports:
        - containerPort: 21998
          hostPort: 21998
          name: grpc
        - containerPort: 9090
          name: prometheus
          protocol: TCP
        - containerPort: 9091
          name: health
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 2
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        securityContext:
          capabilities:
            add:
            - DAC_OVERRIDE
            drop:
            - ALL
          runAsGroup: 0
          runAsUser: 0
        volumeMounts:
        - mountPath: /var/lib/ate
          name: ate-base
        - mountPath: /run/objectstore-plugin
          name: objectstore-plugin
        - mountPath: /run/podidentity.podcert.ate.dev
          name: podidentity
        - mountPath: /run/servicedns.podcert.ate.dev
          name: servicedns-ca
          readOnly: true
        - mountPath: /var/lib/kubelet/plugins
          name: kubelet-plugins
        - mountPath: /var/lib/kubelet/device-plugins
          name: device-plugins
        - mountPath: /host/dev
          name: host-dev
          readOnly: true
        - mountPath: /run/image-credential-provider/bin
          name: image-credential-provider-bin
          readOnly: true
        - mountPath: /run/image-credential-provider/config.yaml
          name: image-credential-provider-config
          readOnly: true
        - mountPath: /etc/atelet/docker
          name: registry-docker-config
          readOnly: true
      initContainers:
      - args:
        - --cert=podidentity.podcert.ate.dev/identity=/out/podidentity
        - --trust=servicedns.podcert.ate.dev/identity=/out/servicedns-ca
        image: {{ include "orb-provider.image" (list $ .Values.images.substrate.podcertAgent) }}
        name: podcert-agent
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
        restartPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          exec:
            command:
            - /ko-app/podcert-agent
            - --check
            - --cert=podidentity.podcert.ate.dev/identity=/out/podidentity
            - --trust=servicedns.podcert.ate.dev/identity=/out/servicedns-ca
          failureThreshold: 300
          periodSeconds: 1
        volumeMounts:
        - mountPath: /var/run/secrets/podcert.ate.dev
          name: podcert-token
          readOnly: true
        - mountPath: /run/podcert-trust
          name: podcert-trust
          readOnly: true
        - mountPath: /out/podidentity
          name: podidentity
        - mountPath: /out/servicedns-ca
          name: servicedns-ca
      - args:
        - node
        - --socket=/run/objectstore-plugin/node.sock
        - --root=/var/lib/ate
        - --asset-staging-dir=/var/lib/objectstore-plugin/asset-staging
        - --asset-staging-capacity=8Gi
        env:
        - name: ATE_STORAGE_BACKEND
          value: s3
        - name: AWS_REGION
          valueFrom:
            configMapKeyRef:
              key: region
              name: ate-aws-config
        envFrom:
        - configMapRef:
            name: ate-otel-config
        image: {{ include "orb-provider.image" (list $ .Values.images.substrate.objectstorePlugin) }}
        name: objectstore-plugin
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
        restartPolicy: Always
        securityContext:
          capabilities:
            drop:
            - ALL
          runAsGroup: 0
          runAsUser: 0
        startupProbe:
          exec:
            command:
            - /ko-app/objectstore-plugin
            - healthcheck
            - --socket=/run/objectstore-plugin/node.sock
          failureThreshold: 30
          periodSeconds: 2
        volumeMounts:
        - mountPath: /var/lib/ate
          name: ate-base
        - mountPath: /run/objectstore-plugin
          name: objectstore-plugin
        - mountPath: /var/lib/objectstore-plugin/asset-staging
          name: asset-staging
      priorityClassName: ate-node-critical
      serviceAccountName: atelet
      terminationGracePeriodSeconds: 330
      tolerations:
      - effect: NoSchedule
        key: ate.dev/sandboxClass
        operator: Exists
      - effect: NoSchedule
        key: cloud.google.com/compute-class
        operator: Exists
      volumes:
      - name: podcert-token
        projected:
          sources:
          - serviceAccountToken:
              audience: podcert.ate.dev
              expirationSeconds: 3600
              path: token
      - configMap:
          name: podcert-trust-bundles
        name: podcert-trust
      - emptyDir:
          medium: Memory
        name: podidentity
      - emptyDir:
          medium: Memory
        name: servicedns-ca
      - hostPath:
          path: /etc/eks/image-credential-provider
          type: DirectoryOrCreate
        name: image-credential-provider-bin
      - hostPath:
          path: /etc/eks/image-credential-provider/config.json
          type: FileOrCreate
        name: image-credential-provider-config
      - emptyDir: {}
        name: objectstore-plugin
      - emptyDir:
          sizeLimit: 9Gi
        name: asset-staging
      - hostPath:
          path: /var/lib/ate
          type: DirectoryOrCreate
        name: ate-base
      - hostPath:
          path: /var/lib/kubelet/plugins
          type: DirectoryOrCreate
        name: kubelet-plugins
      - hostPath:
          path: /var/lib/kubelet/device-plugins
          type: DirectoryOrCreate
        name: device-plugins
      - hostPath:
          path: /dev
          type: Directory
        name: host-dev
      - name: registry-docker-config
        secret:
          items:
          - key: .dockerconfigjson
            path: config.json
          optional: true
          secretName: {{ .Values.atelet.registry.dockerConfigSecret }}
---
apiVersion: ate.dev/v1alpha1
kind: SandboxConfig
metadata:
  annotations:
    sandboxconfig.ate.dev/is-class-default: "true"
  name: gvisor-default
spec:
  defaultVersion: v4
  sandboxClass: gvisor
  versions:
  - assets:
      amd64:
        gvisor:
          sha256: fa72f0d45756c69a30beec21222c78241b0d330c36f4f2185648617cc23415c8
          url: gs://gvisor/releases/nightly/2026-10-17/x86_64/gvisor.tar.zstd
      arm64:
        gvisor:
          sha256: 238634978d99f0dd3e631c4f88eae7b19fb36937065428467f0b6d6b10697689
          url: gs://gvisor/releases/nightly/2026-10-17/aarch64/gvisor.tar.zstd
    name: v4
    pauseImage: registry.k8s.io/pause:3.10.2@sha256:f548e0e8e3dc1896ca956272154dde3314e8cc4fde0a57577ee9fa1c63f5baf4
    state: Enabled
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ate-api-server
  namespace: ate-system
spec:
  ingress:
  - from:
    - podSelector:
        matchExpressions:
        - key: app
          operator: In
          values:
          - ate-controller
          - atelet
          - atenet-egress
          - atenet-router
    - namespaceSelector:
        matchLabels:
          ate.dev/api-access: "true"
      podSelector:
        matchExpressions:
        - key: ate.dev/worker-pool
          operator: DoesNotExist
    ports:
    - port: 443
      protocol: TCP
  podSelector:
    matchLabels:
      app: ate-api-server
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ate-idp-server
  namespace: ate-system
spec:
  ingress:
  - ports:
    - port: https
      protocol: TCP
  podSelector:
    matchLabels:
      app: ate-idp-server
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ate-system-observability
  namespace: ate-system
spec:
  ingress:
  - ports:
    - port: metrics
      protocol: TCP
    - port: prometheus
      protocol: TCP
    - port: envoy-metrics
      protocol: TCP
    - port: health
      protocol: TCP
    - port: healthz
      protocol: TCP
    - port: stats
      protocol: TCP
    - port: readiness
      protocol: TCP
  podSelector:
    matchExpressions:
    - key: app
      operator: NotIn
      values:
      - k8s-credential-provider
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atelet
  namespace: ate-system
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ate-api-server
    ports:
    - port: grpc
      protocol: TCP
  podSelector:
    matchLabels:
      app: atelet
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: atenet-egress
  namespace: ate-system
spec:
  ingress:
  - from:
    - namespaceSelector: {}
      podSelector:
        matchExpressions:
        - key: ate.dev/worker-pool
          operator: Exists
    ports:
    - port: https
      protocol: TCP
  podSelector:
    matchLabels:
      app: atenet-egress
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: ate-system
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: ate-system
spec:
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: ate-api-server
    ports:
    - port: postgres
      protocol: TCP
  podSelector:
    matchLabels:
      app: postgres
  policyTypes:
  - Ingress
{{- end }}
