apiVersion: v1
kind: ServiceAccount
metadata:
  name: amp-orb-provider
  namespace: {{ .Release.Namespace }}
---
# pods, replicasets (the pool's current template) and workerpools are for the worker scaler.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: amp-orb-provider
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list', 'patch', 'delete']
  - apiGroups: ['apps']
    resources: ['replicasets']
    verbs: ['get', 'list']
  - apiGroups: ['ate.dev']
    resources: ['workerpools']
    verbs: ['get']
  - apiGroups: ['ate.dev']
    resources: ['workerpools/scale']
    verbs: ['patch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: amp-orb-provider
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: amp-orb-provider
subjects:
  - kind: ServiceAccount
    name: amp-orb-provider
    namespace: {{ .Release.Namespace }}
---
# The scaler watches nodes to suspend sandboxes on nodes about to be drained.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: amp-orb-provider-nodes
rules:
  - apiGroups: ['']
    resources: ['nodes']
    verbs: ['get', 'list']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: amp-orb-provider-nodes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: amp-orb-provider-nodes
subjects:
  - kind: ServiceAccount
    name: amp-orb-provider
    namespace: {{ .Release.Namespace }}
